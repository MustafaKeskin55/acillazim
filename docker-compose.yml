services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
    container_name: acillazim-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - acillazim-network

networks:
  acillazim-network:
    name: test2_acillazim-network
    external: true
